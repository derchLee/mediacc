<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    MediaCC favicon
    Concept: Bold "M" mark on a blue gradient rounded-square,
    with a small conversion arrow (↻) glyph in the bottom-right
    to signal "media conversion". Designed to remain legible at 16x16.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- Letter M: thick strokes, generous spacing, optical-center adjusted -->
  <path d="M 22 74 L 22 28 L 34 28 L 50 52 L 66 28 L 78 28 L 78 74 L 67 74 L 67 46 L 53 66 L 47 66 L 33 46 L 33 74 Z"
        fill="#ffffff"/>

  <!-- Conversion glyph: two arrows (↻) in bottom-right corner, small but readable -->
  <g transform="translate(70 70)" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <path d="M -8 -2 A 8 8 0 0 1 6 -6"/>
    <polyline points="3,-9 6,-6 3,-3"/>
    <path d="M 8 2 A 8 8 0 0 1 -6 6"/>
    <polyline points="-3,9 -6,6 -3,3"/>
  </g>
</svg>
